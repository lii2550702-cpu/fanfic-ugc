<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>同人留言墙 · 从入圈到入坑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#EED6EC;--mid:#D4A8D0;--deep:#7A4A7A;--cream:#FAF7FB;
  --text:#2D1F2D;--muted:#9A8A9A;--border:#E4CDE2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--deep);
  font-family:'Noto Sans SC',sans-serif;
  display:flex;flex-direction:column;
  position:relative;
}

/* ── 背景装饰 ── */
.bg-deco{position:fixed;inset:0;pointer-events:none;z-index:0;}
.bg-circle{position:absolute;border-radius:50%;background:rgba(238,214,236,.07);}

/* ── 顶部标题栏 ── */
.header{
  position:relative;z-index:10;
  padding:24px 32px 20px;
  text-align:center;
  border-bottom:0.5px solid rgba(238,214,236,.2);
  flex-shrink:0;
}
.header-eyebrow{
  font-size:10px;letter-spacing:.3em;color:rgba(255,255,255,.4);
  text-transform:uppercase;margin-bottom:8px;
}
.header-title{
  font-family:'Noto Serif SC',serif;
  font-size:22px;color:white;font-weight:600;letter-spacing:.05em;
  margin-bottom:4px;
}
.header-title em{color:var(--mid);font-style:normal;}
.header-sub{font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.08em;}

/* ── 墙体区域 ── */
.wall-area{
  flex:1;overflow:hidden;position:relative;z-index:1;
  padding:20px 24px;
}
.wall-inner{
  width:100%;height:100%;
  position:relative;overflow:hidden;
}

/* ── 便利贴 ── */
.note-card{
  position:absolute;
  width:160px;
  border-radius:4px;
  padding:14px 14px 18px;
  cursor:default;
  transition:transform .3s ease, box-shadow .3s ease;
  box-shadow:2px 3px 12px rgba(0,0,0,.25);
  animation:noteAppear .5s cubic-bezier(.175,.885,.32,1.275);
}
.note-card:hover{
  transform:scale(1.06) rotate(0deg)!important;
  box-shadow:4px 6px 20px rgba(0,0,0,.35);
  z-index:50!important;
}
@keyframes noteAppear{
  from{opacity:0;transform:scale(.6) rotate(0deg);}
  to{opacity:1;}
}

.note-header{
  display:flex;align-items:center;gap:6px;margin-bottom:8px;
}
.note-avatar{
  width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:white;font-weight:500;flex-shrink:0;
}
.note-author{font-size:10px;font-weight:500;color:rgba(0,0,0,.55);letter-spacing:.03em;}
.note-text{font-size:12px;line-height:1.65;color:rgba(0,0,0,.7);font-weight:300;}
.note-tag{
  position:absolute;bottom:8px;right:10px;
  font-size:9px;color:rgba(0,0,0,.3);letter-spacing:.05em;
}
/* 图钉 */
.note-pin{
  position:absolute;top:-7px;left:50%;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* ── 底部输入区 ── */
.input-area{
  position:relative;z-index:10;
  padding:16px 24px 24px;
  border-top:0.5px solid rgba(238,214,236,.15);
  background:rgba(45,15,45,.6);
  backdrop-filter:blur(12px);
  flex-shrink:0;
}
.input-label{
  font-size:10px;letter-spacing:.15em;color:rgba(255,255,255,.4);
  text-transform:uppercase;margin-bottom:10px;
}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.input-group{flex:1;display:flex;flex-direction:column;gap:6px;}
.input-name{
  background:rgba(255,255,255,.08);border:0.5px solid rgba(238,214,236,.2);
  border-radius:8px;padding:9px 14px;
  font-size:12px;color:white;font-family:'Noto Sans SC',sans-serif;
  outline:none;width:140px;
}
.input-name::placeholder{color:rgba(255,255,255,.25);}
.input-name:focus{border-color:rgba(212,168,208,.5);background:rgba(255,255,255,.11);}
.input-text{
  flex:1;
  background:rgba(255,255,255,.08);border:0.5px solid rgba(238,214,236,.2);
  border-radius:8px;padding:9px 14px;
  font-size:13px;color:white;font-family:'Noto Sans SC',sans-serif;
  outline:none;resize:none;height:42px;line-height:1.5;
}
.input-text::placeholder{color:rgba(255,255,255,.25);}
.input-text:focus{border-color:rgba(212,168,208,.5);background:rgba(255,255,255,.11);}
.submit-btn{
  background:var(--rose);color:var(--deep);border:none;border-radius:8px;
  padding:0 22px;height:42px;
  font-size:12px;font-family:'Noto Sans SC',sans-serif;font-weight:500;
  letter-spacing:.1em;cursor:pointer;transition:all .18s;
  white-space:nowrap;flex-shrink:0;
}
.submit-btn:hover{background:white;transform:translateY(-1px);}
.submit-btn:active{transform:scale(.97);}
.input-hint{
  margin-top:8px;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:.05em;
}

/* ── 计数 ── */
.note-count{
  position:fixed;top:24px;right:28px;z-index:20;
  font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.1em;
}

/* ── 满屏星星装饰 ── */
.star-deco{
  position:fixed;pointer-events:none;z-index:0;
  opacity:0;animation:twinkle var(--dur,3s) var(--delay,0s) infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0}
  50%{opacity:var(--op,.15)}
}
</style>
</head>
<body>

<div class="bg-deco">
  <div class="bg-circle" style="width:400px;height:400px;top:-150px;right:-100px;"></div>
  <div class="bg-circle" style="width:280px;height:280px;bottom:-80px;left:-60px;"></div>
  <div class="bg-circle" style="width:200px;height:200px;top:40%;left:30%;"></div>
</div>

<!-- 星星装饰 -->
<svg class="star-deco" style="left:8%;top:20%;--dur:4s;--delay:0s;--op:.2" viewBox="0 0 20 20" width="12"><polygon points="10,1 12,7 19,7 13,11 15,18 10,14 5,18 7,11 1,7 8,7" fill="#EED6EC"/></svg>
<svg class="star-deco" style="right:12%;top:35%;--dur:5s;--delay:1s;--op:.15" viewBox="0 0 20 20" width="10"><polygon points="10,1 12,7 19,7 13,11 15,18 10,14 5,18 7,11 1,7 8,7" fill="#D4A8D0"/></svg>
<svg class="star-deco" style="left:20%;bottom:30%;--dur:3.5s;--delay:.5s;--op:.18" viewBox="0 0 20 20" width="8"><polygon points="10,1 12,7 19,7 13,11 15,18 10,14 5,18 7,11 1,7 8,7" fill="#EED6EC"/></svg>
<svg class="star-deco" style="right:25%;bottom:25%;--dur:4.5s;--delay:2s;--op:.12" viewBox="0 0 20 20" width="14"><polygon points="10,1 12,7 19,7 13,11 15,18 10,14 5,18 7,11 1,7 8,7" fill="#D4A8D0"/></svg>
<svg class="star-deco" style="left:55%;top:15%;--dur:6s;--delay:.8s;--op:.1" viewBox="0 0 20 20" width="9"><polygon points="10,1 12,7 19,7 13,11 15,18 10,14 5,18 7,11 1,7 8,7" fill="#EED6EC"/></svg>

<div class="note-count" id="note-count">0 条留言</div>

<!-- 标题栏 -->
<div class="header">
  <div class="header-eyebrow">Fan Wall · 同人留言墙</div>
  <div class="header-title">你的<em>入坑瞬间</em>是什么？</div>
  <div class="header-sub">写下你的故事，贴在这里</div>
</div>

<!-- 墙体 -->
<div class="wall-area">
  <div class="wall-inner" id="wall"></div>
</div>

<!-- 输入区 -->
<div class="input-area">
  <div class="input-label">写下你的留言</div>
  <div class="input-row">
    <input class="input-name" id="input-name" placeholder="你的名字（选填）" maxlength="8">
    <textarea class="input-text" id="input-text" placeholder="我的入坑瞬间是……" maxlength="60"></textarea>
    <button class="submit-btn" onclick="addNote()">贴上去 →</button>
  </div>
  <div class="input-hint">最多60字 · 留言将展示在上方留言墙上</div>
</div>

<script>
// ── 配色方案 ──────────────────────────────────────────
const NOTE_COLORS = [
  {bg:'#F9EDF7',pin:'#C49AC0'},
  {bg:'#F5E8F4',pin:'#B490B0'},
  {bg:'#EDE0F0',pin:'#9A6A9A'},
  {bg:'#F7F0FC',pin:'#C49AC0'},
  {bg:'#F2E4EF',pin:'#D4A8D0'},
  {bg:'#FBF0FA',pin:'#B490B0'},
  {bg:'#EAD8F2',pin:'#9A6A9A'},
];
const AVATAR_COLORS=['#C49AC0','#9A6A9A','#B490B0','#7A4A7A','#D4A8D0'];
const TAGS=['✦ 为爱发电','✦ 圈地自萌','✦ 嗑CP中','✦ 同好相遇','✦ 入坑记','✦ 太太们'];

// ── 预设留言（你自己可以修改这里的内容）────────────────
const PRESET_NOTES = [
  {
    name:'小鱼',
    text:'那天在抖音刷到一个甄嬛混剪，配乐一响我就哭了。完全不知道这叫同人，只是觉得这才是我想看的故事。',
    tag:'✦ 入坑记',
    rotate:-3,x:4,y:6,z:1,colorIdx:0
  },
  {
    name:'月兔',
    text:'看到瓶邪的一篇AU，两个人在便利店相遇，读完之后发呆了很久。从此知道世界上有同人这种东西。',
    tag:'✦ 嗑CP中',
    rotate:2,x:22,y:8,z:2,colorIdx:1
  },
  {
    name:'晚星',
    text:'五条悟死的时候我哭了整整一晚，第二天在LOFTER搜"五条悟没有死"，搜出来三千多篇文。我知道我回不了头了。',
    tag:'✦ 为爱发电',
    rotate:-2,x:44,y:4,z:3,colorIdx:2
  },
  {
    name:'糖猫',
    text:'室友拉着我看了一部同人文，我说这写的什么乱七八糟的，然后我自己偷偷找了作者其他作品，看了一整夜。',
    tag:'✦ 圈地自萌',
    rotate:3,x:64,y:10,z:4,colorIdx:3
  },
  {
    name:'阿椰',
    text:'以为自己只是个普通观众，直到我开始给某个角色写小作文，才意识到我早就入坑了，而且入得很深。',
    tag:'✦ 太太们',
    rotate:-1,x:82,y:5,z:5,colorIdx:4
  },
  {
    name:'浮光',
    text:'在评论区看到一句"如果他没有死，故事会怎么走"，然后我花了两个小时写了一个答案，发在了LOFTER上。那是我写的第一篇同人。',
    tag:'✦ 同好相遇',
    rotate:2,x:10,y:42,z:6,colorIdx:5
  },
  {
    name:'雪落',
    text:'明明不是创作型选手，但每次看到有人写我最喜欢的CP我都想点赞评论收藏，后来才知道这也是同人文化的一部分。',
    tag:'✦ 为爱发电',
    rotate:-3,x:30,y:48,z:7,colorIdx:0
  },
  {
    name:'无名',
    text:'高考结束那个暑假，在宿舍偷看了人生第一篇耽美同人。窗外蝉声很响，我看完合上手机，觉得世界有点不一样了。',
    tag:'✦ 入坑记',
    rotate:1,x:55,y:38,z:8,colorIdx:6
  },
  {
    name:'橘子',
    text:'喜欢一个角色喜欢到想让他过得好一点，去找同人文，发现已经有人帮他过上了很好的日子。那一刻真的很感动。',
    tag:'✦ 圈地自萌',
    rotate:-2,x:75,y:44,z:9,colorIdx:1
  },
];

let noteCount = 0;
const wall = document.getElementById('wall');

function getWallSize(){
  return {w:wall.offsetWidth, h:wall.offsetHeight};
}

function createNoteEl(data, isNew=false){
  const {name,text,tag,rotate,x,y,z,colorIdx} = data;
  const color = NOTE_COLORS[colorIdx % NOTE_COLORS.length];
  const avatarColor = AVATAR_COLORS[colorIdx % AVATAR_COLORS.length];
  const displayName = name || '匿名同好';
  const initial = displayName.charAt(0);

  const {w,h} = getWallSize();
  const left = isNew
    ? Math.random()*Math.max(0,w-180)
    : (x/100)*Math.max(0,w-180);
  const top = isNew
    ? Math.random()*Math.max(0,h-180)
    : (y/100)*Math.max(0,h-160);
  const rot = rotate || (Math.random()*8-4);

  const el = document.createElement('div');
  el.className = 'note-card';
  el.style.cssText = `
    left:${left}px;top:${top}px;
    transform:rotate(${rot}deg);
    background:${color.bg};
    z-index:${z||10};
  `;
  el.innerHTML = `
    <div class="note-pin" style="background:${color.pin}"></div>
    <div class="note-header">
      <div class="note-avatar" style="background:${avatarColor}">${initial}</div>
      <div class="note-author">${displayName}</div>
    </div>
    <div class="note-text">${text}</div>
    <div class="note-tag">${tag || TAGS[Math.floor(Math.random()*TAGS.length)]}</div>
  `;

  // 点击置顶
  el.addEventListener('click',()=>{
    document.querySelectorAll('.note-card').forEach(n=>n.style.zIndex='10');
    el.style.zIndex='50';
  });

  return el;
}

// 渲染预设留言
function renderPresets(){
  PRESET_NOTES.forEach((note,i)=>{
    setTimeout(()=>{
      const el = createNoteEl(note, false);
      wall.appendChild(el);
      noteCount++;
      updateCount();
    }, i*80);
  });
}

// 添加新留言
function addNote(){
  const name = document.getElementById('input-name').value.trim();
  const text = document.getElementById('input-text').value.trim();
  if(!text){
    const input = document.getElementById('input-text');
    input.style.borderColor='rgba(238,214,236,.6)';
    input.focus();
    setTimeout(()=>input.style.borderColor='',1000);
    return;
  }

  const data = {
    name: name,
    text: text,
    tag: TAGS[Math.floor(Math.random()*TAGS.length)],
    rotate: Math.random()*8-4,
    colorIdx: Math.floor(Math.random()*NOTE_COLORS.length),
  };
  const el = createNoteEl(data, true);
  // 新卡片在中间偏上出现
  const {w,h} = getWallSize();
  el.style.left = (w/2 - 80 + (Math.random()*60-30)) + 'px';
  el.style.top  = (h*0.3 + (Math.random()*40-20)) + 'px';
  el.style.zIndex = '100';
  wall.appendChild(el);

  noteCount++;
  updateCount();

  // 清空输入
  document.getElementById('input-name').value='';
  document.getElementById('input-text').value='';

  // 新卡片高亮一下
  setTimeout(()=>{ el.style.zIndex='20'; }, 2000);
}

function updateCount(){
  document.getElementById('note-count').textContent = noteCount + ' 条留言';
}

// 回车提交
document.getElementById('input-text').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); addNote(); }
});

// 初始化
window.addEventListener('load', renderPresets);
</script>
</body>
</html>
